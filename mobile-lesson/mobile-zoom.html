<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片查看器 · 双指缩放</title>
<!--
  文件名：mobile-zoom.html
  姓名：________    学号：____________
  说明：任务三 图片查看器。
        双指缩放 1x~4x（以两指中点为基准，缩放不跳）、双击 1x/2x 切换、
        放大后单指拖动查看细节、缩回 1x 自动居中、横竖屏切换不丢状态。
  答辩要点（缩放不跳）：把屏幕坐标换算成图片自身坐标 p = (m - t) / s，
        缩放后再反算 t2 = m - p * s2，两指中点下的那一点始终不动。
-->
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: #0b0912; color: #efeaf7;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
  }
  .wy_top {
    flex: none; padding: 14px 16px 10px; text-align: center;
    background: linear-gradient(180deg, #171226 0%, rgba(11,9,18,0) 100%);
  }
  .wy_top h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: 2px; font-weight: 600; }
  .wy_top p { margin: 0; font-size: 12px; color: #8f86a6; }

  /* 画框：接管全部手势 */
  .wy_viewer {
    flex: 1; position: relative; overflow: hidden;
    touch-action: none;            /* 这一块的手势全归我，浏览器别滚别缩 */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    background: #05040a;
  }
  /* 图片本体：以左上角为变换原点，方便做数学换算 */
  .wy_img {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%; display: block;
    transform-origin: 0 0;
    will-change: transform;
  }

  .wy_scale, .wy_reset {
    position: absolute; z-index: 5; font-size: 12px; line-height: 1;
    padding: 9px 13px; border-radius: 999px;
    background: rgba(22, 17, 34, .72); color: #ddd6ef;
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(8px);
  }
  .wy_scale { left: 14px; bottom: 16px; font-variant-numeric: tabular-nums; }
  .wy_reset { right: 14px; bottom: 16px; cursor: pointer; }
  .wy_reset:active { background: rgba(183, 139, 255, .35); }

  .wy_hint {
    position: absolute; z-index: 4; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 20px; border-radius: 16px; font-size: 13px; text-align: center;
    line-height: 1.7; color: #efeaf7;
    background: rgba(18, 13, 30, .82); border: 1px solid rgba(183,139,255,.35);
    transition: opacity .4s ease;
  }
  .wy_hint.wy_hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="wy_top">
  <h1>双指缩放 · 图片查看器</h1>
  <p>双指缩放（1x～4x）· 双击放大 2x · 放大后单指拖动</p>
</div>

<div class="wy_viewer" id="wyViewer">
  <!-- 内联 SVG 当"大图"，离线也能缩放，细节足够多便于观察 -->
  <svg class="wy_img" id="wyImg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wySky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1b1b4b"/>
        <stop offset="45%" stop-color="#5b3f8f"/>
        <stop offset="72%" stop-color="#d97a8e"/>
        <stop offset="100%" stop-color="#f3b26b"/>
      </linearGradient>
      <linearGradient id="wySea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#26314f"/>
        <stop offset="100%" stop-color="#0d1220"/>
      </linearGradient>
      <radialGradient id="wySun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff6d5"/>
        <stop offset="55%" stop-color="#ffd27a"/>
        <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="800" height="1000" fill="url(#wySky)"/>
    <circle cx="560" cy="330" r="150" fill="url(#wySun)"/>
    <circle cx="560" cy="330" r="46" fill="#fff4cf"/>

    <!-- 远山 -->
    <path d="M0 560 L150 400 L290 545 L400 430 L540 570 L640 470 L800 585 L800 640 L0 640 Z" fill="#3b2f63" opacity=".85"/>
    <!-- 近山 -->
    <path d="M0 640 L120 520 L250 640 L380 505 L520 660 L660 545 L800 655 L800 720 L0 720 Z" fill="#241c42"/>

    <!-- 海面 -->
    <rect y="700" width="800" height="300" fill="url(#wySea)"/>
    <path d="M520 700 L600 700 L760 1000 L420 1000 Z" fill="#ffb066" opacity=".18"/>
    <g stroke="#7b6fae" stroke-width="2" opacity=".45">
      <path d="M40 760 H240"/><path d="M300 790 H470"/><path d="M90 830 H300"/>
      <path d="M430 860 H640"/><path d="M140 900 H360"/><path d="M500 930 H720"/>
      <path d="M60 960 H260"/>
    </g>

    <!-- 飞鸟 -->
    <g stroke="#f6e9d6" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round">
      <path d="M180 250 q12 -12 24 0 q12 -12 24 0"/>
      <path d="M260 200 q9 -9 18 0 q9 -9 18 0"/>
      <path d="M330 300 q7 -7 14 0 q7 -7 14 0"/>
    </g>

    <!-- 细节纹理，放大后可见 -->
    <g fill="#ffffff" opacity=".55">
      <circle cx="120" cy="120" r="2"/><circle cx="210" cy="90" r="1.6"/>
      <circle cx="300" cy="150" r="2.2"/><circle cx="410" cy="110" r="1.4"/>
      <circle cx="690" cy="180" r="1.8"/><circle cx="740" cy="260" r="1.5"/>
      <circle cx="90" cy="330" r="1.6"/><circle cx="640" cy="420" r="2"/>
    </g>
    <text x="400" y="960" text-anchor="middle" font-size="22" fill="#9c92be"
          font-family="Microsoft YaHei" letter-spacing="6">山 海 之 间</text>
  </svg>

  <div class="wy_hint" id="wyHint">双指缩放请用手机打开<br><span style="font-size:11px;color:#9c92be">电脑上可用触控板双指 / 双击体验</span></div>
  <div class="wy_scale" id="wyScaleLabel">1.0x</div>
  <div class="wy_reset" id="wyReset">复位</div>
</div>

<script>
/* ================= 状态 ================= */
var wy_viewer = document.getElementById('wyViewer');
var wy_img    = document.getElementById('wyImg');
var wy_scaleLabel = document.getElementById('wyScaleLabel');
var wy_hint   = document.getElementById('wyHint');

var wy_scale = 1;        // 当前缩放倍数
var wy_tx = 0, wy_ty = 0; // 当前平移（相对容器左上角，单位 px）

var WY_MIN = 1, WY_MAX = 4;   // 缩放范围 1x~4x

// 手势过程中的临时变量
var wy_mode = 'none';         // none | pinch | drag
var wy_startDist = 0;         // 双指起始间距
var wy_startScale = 1;        // 双指起始缩放
var wy_startMid = { x: 0, y: 0 };   // 双指起始中点
var wy_startT = { x: 0, y: 0 };     // 双指起始平移
var wy_startX = 0, wy_startY = 0;   // 单指起始坐标
var wy_dragT = { x: 0, y: 0 };      // 单指拖动起始平移
var wy_moved = false;               // 本次触摸是否发生过移动
var wy_lastTap = 0;                 // 上一次轻点时间（双击判定）

/* ================= 工具函数 ================= */
function wy_size() {
  return { w: wy_viewer.clientWidth, h: wy_viewer.clientHeight };
}

// 限制平移范围：图片铺满容器，放大后不能拖出空白
function wy_clamp() {
  var s = wy_size();
  var minX = s.w - s.w * wy_scale;   // 负值：最多往左拖多少
  var minY = s.h - s.h * wy_scale;
  if (wy_tx > 0) wy_tx = 0;
  if (wy_tx < minX) wy_tx = minX;
  if (wy_ty > 0) wy_ty = 0;
  if (wy_ty < minY) wy_ty = minY;
}

// 渲染 transform
function wy_apply(animate) {
  wy_img.style.transition = animate
    ? 'transform .25s cubic-bezier(.22,.8,.28,1)'   // 双击 / 复位 0.25s
    : 'none';
  wy_img.style.transform =
    'translate(' + wy_tx + 'px,' + wy_ty + 'px) scale(' + wy_scale + ')';
  wy_scaleLabel.textContent = wy_scale.toFixed(1) + 'x';
}

// 以某点为中心缩放到目标倍数（核心：保证该点下的画面不跳动）
// m 是相对容器左上角的坐标
function wy_zoomTo(wy_target, m, animate) {
  wy_target = Math.min(WY_MAX, Math.max(WY_MIN, wy_target));
  var k = wy_target / wy_scale;
  // 该点对应的图片坐标 p = (m - t) / s；缩放后 t2 = m - p * s2 = m - k*(m - t)
  wy_tx = m.x - k * (m.x - wy_tx);
  wy_ty = m.y - k * (m.y - wy_ty);
  wy_scale = wy_target;
  wy_clamp();
  wy_apply(animate);
}

// 复位到 1x 居中
function wy_reset(animate) {
  wy_scale = 1; wy_tx = 0; wy_ty = 0;
  wy_apply(animate !== false);
}

// 两点距离
function wy_dist(t1, t2) {
  return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
}
// 两点中点（相对容器）
function wy_mid(t1, t2) {
  var r = wy_viewer.getBoundingClientRect();
  return {
    x: (t1.clientX + t2.clientX) / 2 - r.left,
    y: (t1.clientY + t2.clientY) / 2 - r.top
  };
}
// 单点相对容器坐标
function wy_point(t) {
  var r = wy_viewer.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

/* ================= touchstart ================= */
wy_viewer.addEventListener('touchstart', function (e) {
  wy_hint.classList.add('wy_hide');
  wy_moved = false;

  if (e.touches.length >= 2) {
    // 进入双指模式：记录起点，后面按"比例"算缩放
    wy_mode = 'pinch';
    wy_startDist = wy_dist(e.touches[0], e.touches[1]);
    wy_startScale = wy_scale;
    wy_startMid = wy_mid(e.touches[0], e.touches[1]);
    wy_startT = { x: wy_tx, y: wy_ty };
    wy_img.style.transition = 'none';
  } else {
    // 单指：可能是拖动，也可能是双击
    wy_mode = 'drag';
    wy_startX = e.touches[0].clientX;
    wy_startY = e.touches[0].clientY;
    wy_dragT = { x: wy_tx, y: wy_ty };
    wy_img.style.transition = 'none';
  }
}, { passive: true });

/* ================= touchmove ================= */
wy_viewer.addEventListener('touchmove', function (e) {
  if (e.touches.length >= 2) {
    e.preventDefault();  // 阻止浏览器自己缩放整页
    // 中途从单指变成双指：补做初始化
    if (wy_mode !== 'pinch') {
      wy_mode = 'pinch';
      wy_startDist = wy_dist(e.touches[0], e.touches[1]);
      wy_startScale = wy_scale;
      wy_startMid = wy_mid(e.touches[0], e.touches[1]);
      wy_startT = { x: wy_tx, y: wy_ty };
      return;
    }
    if (wy_startDist <= 0) return;

    var wy_d = wy_dist(e.touches[0], e.touches[1]);
    var wy_ratio = wy_d / wy_startDist;                       // 相对起始的缩放比
    var wy_target = Math.min(WY_MAX, Math.max(WY_MIN, wy_startScale * wy_ratio));
    var wy_k = wy_target / wy_startScale;                     // 本帧相对起始的放大倍数

    // 缩放时同时跟随两指中点移动，手感更自然
    var wy_m = wy_mid(e.touches[0], e.touches[1]);
    wy_tx = wy_m.x - wy_k * (wy_startMid.x - wy_startT.x);
    wy_ty = wy_m.y - wy_k * (wy_startMid.y - wy_startT.y);
    wy_scale = wy_target;
    wy_clamp();
    wy_apply(false);
    wy_moved = true;
    return;
  }

  // 单指且已放大 → 拖动查看细节
  if (wy_mode === 'drag' && e.touches.length === 1) {
    var wy_dx = e.touches[0].clientX - wy_startX;
    var wy_dy = e.touches[0].clientY - wy_startY;
    if (Math.abs(wy_dx) > 6 || Math.abs(wy_dy) > 6) wy_moved = true;

    if (wy_scale > 1 && wy_moved) {
      e.preventDefault();
      wy_tx = wy_dragT.x + wy_dx;
      wy_ty = wy_dragT.y + wy_dy;
      wy_clamp();          // 实时限制，拖不出边界
      wy_apply(false);
    }
  }
}, { passive: false });

/* ================= touchend ================= */
wy_viewer.addEventListener('touchend', function (e) {
  if (e.touches.length > 0) return;   // 还有手指没抬起，继续

  if (wy_mode === 'pinch') {
    wy_mode = 'none';
    // 缩得比 1x 还小 → 回弹归位；否则吸附在范围内
    if (wy_scale < 1.02) {
      wy_reset(true);
    } else {
      wy_scale = Math.min(WY_MAX, wy_scale);
      wy_clamp();
      wy_apply(true);
    }
    wy_startDist = 0;
    return;
  }

  // 单指结束
  wy_mode = 'none';

  if (wy_moved) {
    // 拖动结束：吸附边界，带一点动画
    wy_clamp();
    wy_apply(true);
    return;
  }

  // 没有移动 → 视为一次轻点，判断双击
  var wy_now = Date.now();
  var wy_p = wy_point(e.changedTouches[0]);

  if (wy_now - wy_lastTap < 300) {
    // 双击：1x ⇄ 2x，以双击点为基准
    if (wy_scale > 1.5) {
      wy_reset(true);
    } else {
      wy_zoomTo(2, wy_p, true);
    }
    wy_lastTap = 0;   // 重置，避免三击被算成两次双击
  } else {
    wy_lastTap = wy_now;
  }
}, { passive: true });

// 被系统打断（来电、手势返回）时收尾
wy_viewer.addEventListener('touchcancel', function () {
  wy_mode = 'none';
  wy_startDist = 0;
  wy_clamp();
  wy_apply(true);
});

/* ================= 复位按钮 / 双击（电脑） ================= */
document.getElementById('wyReset').addEventListener('click', function () {
  wy_reset(true);
});
wy_viewer.addEventListener('dblclick', function (e) {
  var r = wy_viewer.getBoundingClientRect();
  var m = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (wy_scale > 1.5) wy_reset(true); else wy_zoomTo(2, m, true);
});

/* ================= 横竖屏切换：缩放状态不丢，只重新夹紧边界 ================= */
function wy_onResize() {
  wy_clamp();
  wy_apply(false);
}
window.addEventListener('resize', wy_onResize);
window.addEventListener('orientationchange', function () {
  setTimeout(wy_onResize, 260);
});

/* 初始渲染 */
wy_apply(false);
setTimeout(function () { wy_hint.classList.add('wy_hide'); }, 3200);
</script>
</body>
</html>
